<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nature Pic of the Day</title>
        <style>
            @import url('https://fonts.googleapis.com/css?family=Permanent+Marker');
            @import url('https://fonts.googleapis.com/css?family=Asap+Condensed');
            @import url('https://fonts.googleapis.com/css?family=Marvel');

        body {
            margin: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #191919;
        }
        .polaroid {
            padding: 1rem;
            background-color: white;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            display: inline-block;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        #image-caption {
            font-family: 'Permanent Marker', cursive;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        button {
            margin-top: 15px;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            background-color: #3f5e56;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Asap Condensed', sans-serif;
            box-shadow: 5px 5px 0px black; /* Thick, hard shadow for Neobrutalism */
            transition: all 0.2s ease-in-out;
        }
        button:hover {
            background-color: #5a8671;
            transform: translate(2px, 2px); /* Slight move towards shadow */
            box-shadow: 3px 3px 0px black; /* Reduce shadow slightly */
        }

        button:active {
            transform: translate(5px, 5px); /* Moves button INTO the shadow */
            box-shadow: 0px 0px 0px black; /* Shadow disappears */
        }
        </style>
    </head>
    <body>
        <div class="polaroid">
            <img id="nature-image" src alt="Nature Image of the Day">
            <p id="image-caption"></p>
        </div>
        <button onclick="loadRandomImage()">New Image</button>
        <script>
        let images = [];
        async function fetchCSV() {
            const response = await fetch('/assets/data/images.csv');
            const csvText = await response.text();
            images = csvText.split('\n').slice(1).map(row => row.split(','));
            loadRandomImage();
        }
        
        function loadRandomImage() {
            if (images.length === 0) return;
            const randomIndex = Math.floor(Math.random() * images.length);
            const [name, url] = images[randomIndex];
            document.getElementById('nature-image').src = url.trim();
            document.getElementById('image-caption').textContent = name.trim();
        }
        
        fetchCSV();
        </script>
    </body>
</html>
